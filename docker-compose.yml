services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-theeroticsocial-theeroticsocialdb-hlyn8e}
      - DB_USER=${DB_USER:-eroticsocialdb}
      - DB_PASS=${DB_PASS:-DGl1g3PsWpm94zy5kDNz}
      - DB_NAME=${DB_NAME:-eroticsocialdb}
      - SITE_URL=${SITE_URL:-https://theeroticsocial.com}
    volumes:
      - uploads_data:/var/www/html/upload
      - cache_data:/var/www/html/cache
    ports:
      - "8080:80"
    networks:
      - dokploy-network

volumes:
  uploads_data:
  cache_data:

networks:
  dokploy-network:
    external: true
